<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176c87"><title>専門調理師問題</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#192d3c;margin:0}main{max-width:720px;margin:auto;padding:22px 16px 72px}h1{font-size:1.45rem}.box{background:white;padding:22px;border-radius:18px;margin:16px 0;box-shadow:0 4px 16px #12283b12}label{display:block;margin:14px 0}select,button,input::file-selector-button{font:inherit;padding:12px;border:1px solid #bdcbd8;border-radius:10px;background:white;color:inherit}select{width:100%;margin-top:5px}button{cursor:pointer}button.primary{background:#176c87;border:0;color:white}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:12px}.row>*{flex:1}.hidden{display:none}.muted{color:#667d8a;font-size:.9rem}.question{font-size:1.23rem;line-height:1.8;white-space:pre-wrap}.answer{font-size:1.3rem;font-weight:700;padding:22px}#explanation{line-height:1.8;white-space:pre-wrap}.ok{color:#17724c}.bad{color:#b0363a}body.dark{background:#101923;color:#e8f0f6}body.dark .box,body.dark select,body.dark button{background:#1b2b3a;color:#e8f0f6;border-color:#506473}body.dark .primary{background:#176c87}body.dark .muted{color:#a6bac7}</style></head><body><main><header class="row" style="align-items:center"><h1>🍳 専門調理師問題</h1><button id="theme" style="flex:0">☾</button></header>
<p class="muted">年度別・頻出・分野別の○×式学習アプリ（非公式）</p>
<section class="box" id="setup">
<p><b>最初に学習データを読み込んでください。</b></p><p class="muted">公式過去問題は公開リポジトリには置いていません。ご自身の端末にある問題JSONを選ぶと、この端末のブラウザー内に保存されます。</p>
<input id="file" type="file" accept=".json,application/json"><button id="clear">登録データ削除</button>
<label>学習コース<select id="course"><option value="year">年度・試験回別</option><option value="frequent">頻出テーマ別</option><option value="category">出題分野別</option></select></label>
<label id="yearWrap">年度・試験回<select id="year"></select></label>
<label class="hidden" id="topicWrap">頻出テーマ<select id="topic"></select></label>
<label class="hidden" id="catWrap">出題分野<select id="category"><option value="食品衛生">食品衛生（問1〜6）</option><option value="公衆衛生">公衆衛生（問7〜12）</option><option value="食品・栄養">食品学・栄養学（問13〜24）</option><option value="法規">法規（問25〜35）</option><option value="労働安全">労働安全衛生（問36〜40）</option></select></label>
<label>出題方法<select id="mode"><option value="all">問題番号順</option><option value="random">ランダム</option><option value="wrong">間違えた問題</option><option value="unlearned">「覚えた」以外</option></select></label>
<p class="muted" id="status"></p><button class="primary" id="start">学習開始</button>
</section>
<section class="box hidden" id="summary"><h2>学習結果</h2><h3 id="summaryTitle"></h3><p id="summaryScore" style="font-size:1.55rem;font-weight:700"></p><p id="summaryRate" class="muted"></p><button class="primary" id="summaryBack">年度・コース選択へ戻る</button></section>
<section class="box hidden" id="quiz"><div class="muted" id="counter"></div><div class="question" id="question"></div><div class="row" id="answers"><button class="answer" data-answer="○">○ 正しい</button><button class="answer" data-answer="×">× 誤り</button></div><div id="feedback" class="hidden"><h3 id="result"></h3><p id="explanation"></p><label><input type="checkbox" id="learned"> 覚えた</label><p><button class="primary" id="next">次の問題へ</button></p></div><button id="back">コース選択へ戻る</button></section><p class="muted">非公式アプリ。試験実施団体とは無関係です。問題JSONは自分の端末だけで利用してください。ブラウザーの保存データを消すと学習履歴も失われます。</p>
</main><script>
const $=s=>document.getElementById(s),dataKey='senmon_common_questions_v1',progressKey='senmon_progress_v1',themes={'4S活動・整理整頓':['4S','整理','整頓','清掃','清潔'],'調理師の業務従事者届':['業務従事者届','届け出','届出'],'食品衛生管理者':['食品衛生管理者'],'食品安全委員会':['食品安全委員会'],'水分活性':['水分活性'],'水道水の一般細菌':['一般細菌'],'DHA・脂肪酸':['DHA','リノール酸'],'労働災害・転倒':['転倒','労働災害'],'食中毒の届出':['食中毒','保健所長'],'健康寿命':['健康寿命','平均余命'],'調理師の名称独占':['名称独占','業務独占']};
let items=[],progress={},queue=[],pos=0,sessionCorrect=0,sessionCourse="",sessionLabel="";try{items=JSON.parse(localStorage.getItem(dataKey)||'[]')}catch{}try{progress=JSON.parse(localStorage.getItem(progressKey)||'{}')}catch{}
const qkey=q=>q.year+':'+(q.session||'')+':'+q.number+':'+q.question,ex=q=>(q.year+' '+(q.session||'')).trim();
function category(q){let n=Number(q.number);return n<=6?'食品衛生':n<=12?'公衆衛生':n<=24?'食品・栄養':n<=35?'法規':'労働安全'}
function years(){let choices=[...new Set(items.map(ex))].sort().reverse();$('year').replaceChildren(...choices.map(x=>new Option(x,x)));let topicNames=Object.keys(themes).filter(t=>items.filter(q=>themes[t].some(w=>q.question.includes(w))).length>=2);$('topic').replaceChildren(...topicNames.map(x=>new Option(x,x)));selection()}
function scoped(){let c=$('course').value;if(c==='year')return items.filter(q=>ex(q)===$('year').value);if(c==='category')return items.filter(q=>category(q)===$('category').value);let words=themes[$('topic').value]||[];return items.filter(q=>words.some(w=>q.question.includes(w)))}
function selection(){let c=$('course').value;$('yearWrap').classList.toggle('hidden',c!=='year');$('topicWrap').classList.toggle('hidden',c!=='frequent');$('catWrap').classList.toggle('hidden',c!=='category');status()}
function status(){let a=scoped();$('status').textContent='登録 '+items.length+'問 ／ 対象 '+a.length+'問 ／ 覚えた '+a.filter(q=>progress[qkey(q)]?.learned).length+'問';$('start').disabled=!a.length}
function show(){if(pos>=queue.length){$('quiz').classList.add('hidden');$('summary').classList.remove('hidden');$('summaryTitle').textContent=sessionLabel+' の結果';$('summaryScore').textContent=queue.length+'問中 '+sessionCorrect+'問正解';$('summaryRate').textContent='正答率 '+(sessionCorrect/queue.length*100).toFixed(1)+'％'+(sessionCourse==='year'&&queue.length===40?'（全40問）':'');status();return}let q=queue[pos];$('counter').textContent=ex(q)+'・問'+q.number+'　'+(pos+1)+' / '+queue.length;$('question').textContent=q.question;$('answers').classList.remove('hidden');$('feedback').classList.add('hidden');$('learned').checked=!!progress[qkey(q)]?.learned}
$('start').onclick=()=>{let m=$('mode').value;queue=scoped().filter(q=>m==='wrong'?progress[qkey(q)]?.correct===false:m==='unlearned'?!progress[qkey(q)]?.learned:true);if(m==='random')queue.sort(()=>Math.random()-.5);if(!queue.length)return alert('対象問題がありません');pos=0;sessionCorrect=0;sessionCourse=$('course').value;sessionLabel=sessionCourse==='year'?$('year').value:sessionCourse==='category'?$('category').selectedOptions[0].textContent:$('topic').value;$('summary').classList.add('hidden');$('setup').classList.add('hidden');$('quiz').classList.remove('hidden');show()};
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let q=queue[pos],yes=q.answer===b.dataset.answer,k=qkey(q),prev=progress[k]||{};if(yes)sessionCorrect++;progress[k]={...prev,correct:yes,attempts:(prev.attempts||0)+1};localStorage.setItem(progressKey,JSON.stringify(progress));$('result').textContent=yes?'正解':'不正解（正解：'+q.answer+'）';$('result').className=yes?'ok':'bad';$('explanation').textContent=q.explanation||'解説は未登録です';$('answers').classList.add('hidden');$('feedback').classList.remove('hidden')});
$('next').onclick=()=>{pos++;show()};$('summaryBack').onclick=()=>{$('summary').classList.add('hidden');$('setup').classList.remove('hidden');status()};$('back').onclick=()=>{$('quiz').classList.add('hidden');$('setup').classList.remove('hidden');status()};$('learned').onchange=e=>{let k=qkey(queue[pos]);progress[k]={...(progress[k]||{}),learned:e.target.checked};localStorage.setItem(progressKey,JSON.stringify(progress))};
$('file').onchange=async e=>{try{let arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr)||!arr.every(q=>q.year&&q.question&&Number.isInteger(Number(q.number))&&['○','×'].includes(q.answer)))throw Error('問題JSONの形式が違います');let m=new Map(items.map(q=>[ex(q)+':'+q.number,q]));arr.forEach(q=>m.set(ex(q)+':'+q.number,{...q,number:Number(q.number)}));items=[...m.values()];localStorage.setItem(dataKey,JSON.stringify(items));years();alert(arr.length+'問を読み込みました')}catch(err){alert('読込失敗: '+err.message)}};
$('clear').onclick=()=>{if(confirm('この端末の問題データを消去しますか？')){items=[];localStorage.removeItem(dataKey);years()}};
['course','year','topic','category','mode'].forEach(k=>$(k).onchange=selection);
$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('senmon_theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('senmon_theme')==='dark')document.body.classList.add('dark');years();
</script></body></html>
